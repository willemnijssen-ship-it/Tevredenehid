<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grappige Quiz</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative;
        }
        .step { display: none; }
        .step.active { display: block; }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            height: 60px;
            position: relative;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .next-btn, .submit-btn { 
            background-color: #28a745; 
            color: white; 
            font-weight: bold;
        }
        .runaway-btn { 
            background-color: #dc3545; 
            color: white; 
            transition: all 0.25s ease-out; 
            z-index: 10;
        }

        /* Styling voor de gekantelde zwaartekracht-slider */
        .slider-wrapper {
            margin: 40px 0;
            position: relative;
        }
        .gravity-slider {
            width: 100%;
            transform: rotate(5deg); /* Kantelt de balk optisch naar beneden richting 100% */
            cursor: pointer;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
        #sliderValue {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- VERGEET HIERONDER NIET JE EIGEN FORMSPREE ID IN TE VULLEN BIJ DE 'f/' -->
    <form id="quizForm" action="https://formspree.io/f/mjyynzla" method="POST">
        
        <!-- Vraag 1 -->
        <div class="step active" id="step1">
            <h2>Vraag 1: Wat is je naam?</h2>
            <input type="text" name="Naam" placeholder="Typ hier..." required>
            <div class="btn-container">
                <button type="button" class="next-btn" onclick="nextStep(1, 2)">Volgende</button>
            </div>
        </div>

        <!-- Vraag 2: NIEUW! Tevredenheid met Zwaartekracht -->
        <div class="step" id="step2">
            <h2>Vraag 2: Hoe tevreden ben je over de verhuurders geweest?</h2>
            <div class="slider-wrapper">
                <input type="range" id="gravitySlider" name="Tevredenheid" min="1" max="100" value="100" class="gravity-slider">
                <div class="slider-labels">
                    <span>1% 😡</span>
                    <span>100% 😍</span>
                </div>
                <div id="sliderValue">100%</div>
            </div>
            <div class="btn-container">
                <button type="button" class="next-btn" onclick="nextStep(2, 3)">Volgende</button>
            </div>
        </div>

        <!-- Vraag 3 -->
        <div class="step" id="step3">
            <h2>Vraag 3: Wat wil je liever ontvangen?</h2>
            <input type="hidden" name="Keuze" value="Bierpakket">
            <div class="btn-container">
                <button type="button" class="next-btn" onclick="nextStep(3, 4)">Bierpakket 🍺</button>
                <button type="button" class="runaway-btn" id="runawayBtn">Wijnpakket 🍷</button>
            </div>
        </div>

        <!-- Vraag 4 -->
        <div class="step" id="step4">
            <h2>Klik hieronder om je keuze te bevestigen!</h2>
            <div class="btn-container">
                <button type="submit" class="submit-btn">Verstuur Feedback</button>
            </div>
        </div>

    </form>
</div>

<script>
    function nextStep(current, next) {
        if (current === 1) {
            const naamInput = document.querySelector('input[name="Naam"]');
            if (naamInput.value.trim() === "") {
                alert("Je moet wel eerst even je naam invullen!");
                return;
            }
        }
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + next).classList.add('active');
    }

    // --- ZWAARTEKRACHT SLIDER LOGICA ---
    const slider = document.getElementById('gravitySlider');
    const sliderValue = document.getElementById('sliderValue');
    let isUserDragging = false;

    // Update tekst tijdens het slepen
    slider.addEventListener('input', () => {
        sliderValue.innerText = slider.value + '%';
    });

    slider.addEventListener('mousedown', () => { isUserDragging = true; });
    slider.addEventListener('touchstart', () => { isUserDragging = true; });
    slider.addEventListener('mouseup', () => { isUserDragging = false; });
    slider.addEventListener('touchend', () => { isUserDragging = false; });

    // Het zwaartekracht-effect (elke 16 milliseconden trekt de code de waarde terug naar 100)
    setInterval(() => {
        if (!isUserDragging && parseInt(slider.value) < 100) {
            // Hoe verder de slider naar links staat, hoe groter de "valversnelling" terug naar rechts
            let currentVal = parseInt(slider.value);
            let speed = Math.ceil((100 - currentVal) * 0.15); 
            slider.value = currentVal + speed;
            sliderValue.innerText = slider.value + '%';
        }
    }, 16);


    // --- WEGRENNENDE KNOP LOGICA ---
    const runawayBtn = document.getElementById('runawayBtn');
    
    function moveButton() {
        if (runawayBtn.style.position !== 'absolute') {
            runawayBtn.style.position = 'absolute';
        }

        const container = document.querySelector('.btn-container');
        const containerRect = container.getBoundingClientRect();
        
        const x = Math.random() * (containerRect.width - runawayBtn.offsetWidth);
        const y = (Math.random() * 260) - 130; 
        
        runawayBtn.style.left = x + 'px';
        runawayBtn.style.top = y + 'px';
    }

    runawayBtn.addEventListener('mouseenter', moveButton);
    runawayBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveButton();
    });
</script>

</body>
</html>
