<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grappige Quiz</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative;
        }
        .step { display: none; }
        .step.active { display: block; }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            height: 60px;
            position: relative;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .next-btn, .submit-btn { 
            background-color: #28a745; 
            color: white; 
            font-weight: bold;
        }
        /* De knop start nu als een normale knop (niet absoluut), dus ze staan netjes langs elkaar */
        .runaway-btn { 
            background-color: #dc3545; 
            color: white; 
            transition: all 0.25s ease-out; 
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- VERGEET HIERONDER NIET JE EIGEN FORMSPREE ID IN TE VULLEN BIJ DE 'f/' -->
    <form id="quizForm" action="https://formspree.io/f/mjyynzla" method="POST">
        
        <!-- Vraag 1 -->
        <div class="step active" id="step1">
            <h2>Vraag 1: Wat is je naam?</h2>
            <input type="text" name="Naam" placeholder="Typ hier..." required>
            <div class="btn-container">
                <button type="button" class="next-btn" onclick="nextStep(1, 2)">Volgende</button>
            </div>
        </div>

        <!-- Vraag 2 -->
        <div class="step" id="step2">
            <h2>Vraag 2: Wat wil je liever ontvangen?</h2>
            <input type="hidden" name="Keuze" value="Bierpakket">
            <div class="btn-container">
                <button type="button" class="next-btn" onclick="nextStep(2, 3)">Bierpakket 🍺</button>
                <button type="button" class="runaway-btn" id="runawayBtn">Wijnpakket 🍷</button>
            </div>
        </div>

        <!-- Vraag 3 -->
        <div class="step" id="step3">
            <h2>Klik hieronder om je keuze te bevestigen!</h2>
            <div class="btn-container">
                <button type="submit" class="submit-btn">Verstuur Feedback</button>
            </div>
        </div>

    </form>
</div>

<script>
    function nextStep(current, next) {
        if (current === 1) {
            const naamInput = document.querySelector('input[name="Naam"]');
            if (naamInput.value.trim() === "") {
                alert("Je moet wel eerst even je naam invullen!");
                return;
            }
        }
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + next).classList.add('active');
    }

    const runawayBtn = document.getElementById('runawayBtn');
    
    function moveButton() {
        // Zodra de muis in de buurt komt, zetten we de knop pas op 'absolute' zodat hij kan vliegen
        if (runawayBtn.style.position !== 'absolute') {
            runawayBtn.style.position = 'absolute';
        }

        const container = document.querySelector('.btn-container');
        const containerRect = container.getBoundingClientRect();
        
        // Bereken een willekeurige plek binnen de containeromgeving
        const x = Math.random() * (containerRect.width - runawayBtn.offsetWidth);
        const y = (Math.random() * 260) - 130; 
        
        runawayBtn.style.left = x + 'px';
        runawayBtn.style.top = y + 'px';
    }

    runawayBtn.addEventListener('mouseenter', moveButton);
    runawayBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveButton();
    });
</script>

</body>
</html>
